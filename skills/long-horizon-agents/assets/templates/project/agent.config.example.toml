# 配置示例，仅供角色和用户参考；脚本不会据此调用模型或创建 scheduled task。
# 实际模型、推理强度和权限通过你的客户端 / 运行平台设置。

[project]
name = "{{PROJECT_NAME}}"
language = "zh-CN"
canonical_root = "待填写"
evidence_root = "待填写"
user_timezone = "Asia/Shanghai"

[planner]
model = "gpt-6-astra"
reasoning_effort = "xhigh"
role_file = ".agent/roles/planner.md"
wake_mode = "milestone_and_low_frequency_review"

[executor]
model = "gpt-6.1-sol"
reasoning_effort = "high"
role_file = ".agent/roles/executor.md"
wake_mode = "next_decisive_signal_eta"

[coordination]
single_launch_owner_per_resource = true
plan_adoption = "safe_boundary"
history = "docs/agent/HISTORY.md"

# 任务范围和任何实际费用 / 资源限制以 MISSION 与用户指令为准。
# 不在此默认设置任务硬停、账单准入或反复审批。
